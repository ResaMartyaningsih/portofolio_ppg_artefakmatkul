<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="semBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f2137"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#semBg)"/>

  <!-- Presentation Screen / Stage -->
  <g transform="translate(200, 70)">
    <rect width="400" height="230" rx="14" fill="#022c22" stroke="#10b981" stroke-width="2"/>
    <text x="200" y="50" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">GELAR KARYA &amp; SEMINAR ARTEFAK</text>
    <line x1="60" y1="70" x2="340" y2="70" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Chart / Visual representation -->
    <rect x="70" y="100" width="40" height="80" rx="4" fill="#10b981"/>
    <rect x="130" y="120" width="40" height="60" rx="4" fill="#34d399"/>
    <rect x="190" y="85" width="40" height="95" rx="4" fill="#6ee7b7"/>
    <rect x="250" y="135" width="40" height="45" rx="4" fill="#a7f3d0"/>
    <circle cx="310" cy="110" r="18" fill="#059669"/>
    <text x="310" y="115" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PTK</text>
  </g>

  <!-- Podium / Badges -->
  <g transform="translate(180, 330)">
    <rect width="440" height="80" rx="16" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="220" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Diseminasi Pembelajaran Inovatif &amp; Refleksi PTK</text>
    <text x="220" y="56" fill="#6ee7b7" font-family="sans-serif" font-size="12" text-anchor="middle">PPG Prajabatan Informatika · Universitas Negeri Yogyakarta</text>
  </g>
</svg>
