<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#vidBg)"/>

  <!-- Video Player Frame -->
  <g transform="translate(150, 70)">
    <rect width="500" height="300" rx="20" fill="#020617" stroke="#4f46e5" stroke-width="2"/>
    
    <!-- Video Content Simulation -->
    <rect x="20" y="20" width="460" height="230" rx="12" fill="#0f172a"/>
    <path d="M 40,210 L 140,140 L 220,180 L 320,110 L 440,200 L 440,230 L 40,230 Z" fill="#312e81" opacity="0.5"/>

    <!-- Red Play Button in Center -->
    <circle cx="250" cy="135" r="42" fill="url(#playGrad)"/>
    <polygon points="242,120 266,135 242,150" fill="#ffffff"/>

    <!-- Progress bar & video controls -->
    <g transform="translate(30, 265)">
      <rect width="440" height="6" rx="3" fill="#334155"/>
      <rect width="180" height="6" rx="3" fill="#ef4444"/>
      <circle cx="180" cy="3" r="6" fill="#ffffff"/>
      <text x="0" y="22" fill="#94a3b8" font-family="monospace" font-size="11">07:24 / 15:00</text>
      <text x="440" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="end">HD 1080p</text>
    </g>
  </g>

  <g transform="translate(150, 400)">
    <rect width="500" height="60" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="250" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Simulasi Pembelajaran Microteaching (DUP &amp; Python)</text>
    <text x="250" y="46" fill="#818cf8" font-family="sans-serif" font-size="12" text-anchor="middle">Praktik Apersepsi, Diferensiasi Konten, dan Penilaian Formatif</text>
  </g>
</svg>
